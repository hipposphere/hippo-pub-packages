name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (leave empty to publish all)"
        required: false
        default: ""

env:
  FLUTTER_VERSION: 3.41.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "any"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.OS }}-flutter-${{  env.FLUTTER_VERSION }}

      - name: Install Melos
        run: dart pub global activate melos

      - name: Set up pub credentials
        env:
          PUB_TOKEN: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          # Add the actual token value (not an env var reference)
          echo "$PUB_TOKEN" | dart pub token add https://registry.hippolabs.org/pub/internal-pub/

      - name: Bootstrap workspace
        run: dart pub global run melos bootstrap

      - name: Publish packages
        run: |
          if [ -z "${{ github.event.inputs.package }}" ]; then
            dart pub global run melos publish --no-dry-run --yes
          else
            cd packages/${{ github.event.inputs.package }}
            dart pub publish --force
          fi
