# yaml-language-server: $schema=https://raw.githubusercontent.com/dart-lang/native/main/pkgs/ffigen/ffigen.schema.json

name: SherpaOnnxBindings
description: Generated bindings for the vendored sherpa-onnx keyword-spotting C API.
output: lib/src/generated/wake_word/sherpa_onnx_bindings.dart

headers:
  entry-points:
    - third_party/sherpa_onnx/include/keyword_spotter_ffi_bridge.h

ffi-native:
  asset-id: package:speech_utils/src/generated/wake_word/sherpa_onnx_bindings.dart

functions:
  include:
    - SherpaOnnxCreateKeywordSpotter
    - SherpaOnnxDestroyKeywordSpotter
    - SherpaOnnxCreateKeywordStream
    - SherpaOnnxIsKeywordStreamReady
    - SherpaOnnxDecodeKeywordStream
    - SherpaOnnxResetKeywordStream
    - SherpaOnnxGetKeywordResultAsJson
    - SherpaOnnxFreeKeywordResultJson
    - SherpaOnnxOnlineStreamAcceptWaveform
    - SherpaOnnxDestroyOnlineStream

structs:
  include:
    - SherpaOnnxKeywordSpotterConfig
    - SherpaOnnxFeatureConfig
    - SherpaOnnxOnlineModelConfig
    - SherpaOnnxOnlineTransducerModelConfig
    - SherpaOnnxOnlineParaformerModelConfig
    - SherpaOnnxOnlineZipformer2CtcModelConfig
    - SherpaOnnxOnlineNemoCtcModelConfig
    - SherpaOnnxOnlineToneCtcModelConfig

preamble: |
  // ignore_for_file: camel_case_types, unused_element, unused_field
