name: desktop_autopaste_linux
description: Linux implementation of the federated desktop_autopaste package.
version: 0.3.0
homepage: https://hippolabs.org
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  code_assets: ^1.2.1
  desktop_autopaste_platform_interface:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.3.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.2

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    implements: desktop_autopaste
    platforms:
      linux:
        dartPluginClass: DesktopAutopasteLinux
