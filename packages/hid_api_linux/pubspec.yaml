name: hid_api_linux
description: Linux implementation of the federated hid_api package.
version: 0.1.8
homepage: https://hippolabs.org
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  hid_api_platform_interface:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    implements: hid_api
    platforms:
      linux:
        dartPluginClass: HidApiLinux
        pluginClass: HidApiPlugin
