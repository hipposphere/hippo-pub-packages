name: hotkey_api
description: "A new Flutter plugin project."
version: 0.0.1
homepage: https://hippolabs.org
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"
resolution: workspace

environment:
  sdk: ^3.9.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.0.0-dev.0
  logging: ^1.3.0
  swiftgen: 0.1.0

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
