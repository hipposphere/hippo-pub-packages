name: speech_utils
description: Utilities for PCM16 VAD segmentation and AAC compression.
version: 0.2.6
homepage: https://hippolabs.org
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"
resolution: workspace

environment:
  sdk: ">=3.11.0 < 4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.0.0
  cross_file: ^0.3.5+2
  ffi: ^2.2.0
  hippo_native_deps:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.1.0
  hooks: ^1.0.2
  jni: ^0.15.2
  native_toolchain_c: ^0.17.5
  path: ^1.9.1

dev_dependencies:
  ffigen: ^20.1.1
  jnigen: ^0.15.0
  lints: ^6.1.0
  test: ^1.26.0

flutter:
  plugin:
    platforms:
      android:
        package: org.hippolabs.speech_utils
        pluginClass: SpeechUtilsPlugin
