[package]
name = "dart_axum_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
