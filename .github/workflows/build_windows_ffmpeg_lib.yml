name: Build Minimal FFmpeg (Windows x64, MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            make
            nasm
            git
            binutils

      - name: Clone FFmpeg
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/ffmpeg/ffmpeg.git

      - name: Configure (audio-only minimal, MSVC + w32threads)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg

          command -v make
          command -v cl.exe
          command -v link.exe

          ./configure \
            --arch=x86_64 \
            --target-os=win64 \
            --toolchain=msvc \
            --prefix="$PWD/out" \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-everything \
            --disable-network \
            --enable-small \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swresample \
            --enable-encoder=aac \
            --enable-decoder=pcm_s16le,aac,mp3 \
            --enable-parser=mpegaudio,aac \
            --enable-demuxer=wav,mp3,mov,aac \
            --enable-muxer=ipod,adts \
            --enable-protocol=file \
            --enable-w32threads \
            --disable-pthreads \
            --disable-iconv \
            --disable-zlib

      - name: Build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg
          make -j"$(nproc)"
          make install

      - name: Assemble minimal artifact layout
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg
          rm -rf out-minimal
          mkdir -p out-minimal/include out-minimal/lib out-minimal/bin
          cp -a out/include/. out-minimal/include/
          cp -a out/lib/. out-minimal/lib/

          shopt -s nullglob
          for pattern in avcodec-*.dll avformat-*.dll avutil-*.dll swresample-*.dll avdevice-*.dll avfilter-*.dll swscale-*.dll; do
            for dll in out/bin/$pattern; do
              cp "$dll" out-minimal/bin/
            done
          done

          cat > out-minimal/BUILD-METADATA.txt <<EOF
          ffmpeg workflow: build_windows_ffmpeg_lib.yml
          profile: audio-only minimal
          toolchain: msvc
          threads: w32threads
          ffmpeg_commit: $(git rev-parse HEAD)
          EOF

      - name: Validate runtime imports (no MinGW transitive deps)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg

          avcodec_dll=$(ls out-minimal/bin/avcodec-*.dll | head -n 1)
          avformat_dll=$(ls out-minimal/bin/avformat-*.dll | head -n 1)
          avutil_dll=$(ls out-minimal/bin/avutil-*.dll | head -n 1)

          for dll in "$avcodec_dll" "$avformat_dll" "$avutil_dll"; do
            if objdump -p "$dll" | grep -Eqi "DLL Name: (libwinpthread-1\.dll|libiconv-2\.dll|zlib1\.dll)"; then
              echo "Unexpected MinGW runtime dependency found in $dll"
              objdump -p "$dll" | grep -Ei "DLL Name: (libwinpthread-1\.dll|libiconv-2\.dll|zlib1\.dll)" || true
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-windows-x64
          path: ffmpeg/out-minimal
