name: desktop_autopaste
description: "A new Flutter plugin project."
version: 0.0.11
resolution: workspace
homepage: https://hippolabs.org
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"


dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: DesktopAutopastePlugin
      macos:
        pluginClass: DesktopAutopastePlugin
      windows:
        pluginClass: DesktopAutopastePluginCApi
