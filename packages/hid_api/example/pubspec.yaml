name: hid_api_example
description: "Demonstrates how to use the hid_api plugin."
publish_to: 'none' 
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  hid_api:
    path: ../
  hippo_utils:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.3.2
  hippo_components:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.1.53
  hippo_core:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.1.4
  hippo_core_flutter:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.1.4


dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
