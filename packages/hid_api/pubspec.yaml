name: hid_api
description: "A new Flutter plugin project."
version: 0.1.6
homepage: https://hippolabs.org
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: HidApiPlugin
      macos:
        pluginClass: HidApiPlugin
      windows:
        pluginClass: HidApiPluginCApi
