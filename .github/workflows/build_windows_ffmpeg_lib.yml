name: Build Minimal FFmpeg (Windows x64, MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >
            make
            nasm
            git
            binutils

      - name: Clone FFmpeg
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/ffmpeg/ffmpeg.git

      - name: Configure (audio-only minimal, MSVC + w32threads)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg

          command -v make

          cl_path="$(command -v cl.exe || command -v cl || true)"
          if [ -z "$cl_path" ]; then
            echo "cl.exe not found in PATH inside MSYS2 shell"
            echo "PATH=$PATH"
            exit 1
          fi

          msvc_bin_dir="$(dirname "$cl_path")"
          export PATH="$msvc_bin_dir:$PATH"
          hash -r

          link_path="$(command -v link.exe || true)"
          if [ -z "$link_path" ]; then
            echo "link.exe not found in PATH inside MSYS2 shell"
            echo "PATH=$PATH"
            exit 1
          fi

          if [ "$link_path" = "/usr/bin/link.exe" ] && [ -x "$msvc_bin_dir/link.exe" ]; then
            export PATH="$msvc_bin_dir:$PATH"
            hash -r
            link_path="$(command -v link.exe || true)"
          fi

          if [ "$link_path" = "/usr/bin/link.exe" ]; then
            echo "Detected /usr/bin/link.exe instead of MSVC linker."
            echo "cl.exe:  $cl_path"
            echo "link.exe:$link_path"
            echo "PATH=$PATH"
            exit 1
          fi

          echo "Using make:    $(command -v make)"
          echo "Using cl.exe:  $cl_path"
          echo "Using link.exe:$link_path"

          ./configure \
            --arch=x86_64 \
            --target-os=win64 \
            --toolchain=msvc \
            --prefix="$PWD/out" \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-everything \
            --disable-network \
            --enable-small \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swresample \
            --enable-encoder=aac \
            --enable-decoder=pcm_s16le,aac,mp3 \
            --enable-parser=mpegaudio,aac \
            --enable-demuxer=wav,mp3,mov,aac \
            --enable-muxer=ipod,adts \
            --enable-protocol=file \
            --enable-w32threads \
            --disable-pthreads \
            --disable-iconv \
            --disable-zlib

      - name: Build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg
          make -j"$(nproc)"
          make install

      - name: Assemble minimal artifact layout
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg
          rm -rf out-minimal
          mkdir -p out-minimal/include out-minimal/lib out-minimal/bin
          cp -a out/include/. out-minimal/include/
          cp -a out/lib/. out-minimal/lib/

          shopt -s nullglob
          for source_dir in out/bin libavcodec libavformat libavutil libswresample libavdevice libavfilter libswscale; do
            for pattern in avcodec-*.dll avcodec.dll avformat-*.dll avformat.dll avutil-*.dll avutil.dll swresample-*.dll swresample.dll avdevice-*.dll avdevice.dll avfilter-*.dll avfilter.dll swscale-*.dll swscale.dll; do
              for dll in "$source_dir"/$pattern; do
                cp "$dll" out-minimal/bin/
              done
            done
          done

          echo "Installed DLLs in out/bin:"
          ls -la out/bin || true
          echo "Bundled DLLs in out-minimal/bin:"
          ls -la out-minimal/bin || true

          cat > out-minimal/BUILD-METADATA.txt <<EOF
          ffmpeg workflow: build_windows_ffmpeg_lib.yml
          profile: audio-only minimal
          toolchain: msvc
          threads: w32threads
          ffmpeg_commit: $(git rev-parse HEAD)
          EOF

      - name: Validate runtime imports (no MinGW transitive deps)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd ffmpeg

          pick_dll() {
            local prefix="$1"
            local picked=""
            shopt -s nullglob
            local versioned=(out-minimal/bin/${prefix}-*.dll)
            local plain=(out-minimal/bin/${prefix}.dll)
            if [ "${#versioned[@]}" -gt 0 ]; then
              picked="${versioned[0]}"
            elif [ "${#plain[@]}" -gt 0 ]; then
              picked="${plain[0]}"
            else
              echo "Missing ${prefix} DLL in out-minimal/bin"
              ls -la out-minimal/bin || true
              return 1
            fi
            echo "$picked"
          }

          avcodec_dll="$(pick_dll avcodec)"
          avformat_dll="$(pick_dll avformat)"
          avutil_dll="$(pick_dll avutil)"

          for dll in "$avcodec_dll" "$avformat_dll" "$avutil_dll"; do
            if objdump -p "$dll" | grep -Eqi "DLL Name: (libwinpthread-1\.dll|libiconv-2\.dll|zlib1\.dll)"; then
              echo "Unexpected MinGW runtime dependency found in $dll"
              objdump -p "$dll" | grep -Ei "DLL Name: (libwinpthread-1\.dll|libiconv-2\.dll|zlib1\.dll)" || true
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-minimal-windows-x64
          path: ffmpeg/out-minimal
