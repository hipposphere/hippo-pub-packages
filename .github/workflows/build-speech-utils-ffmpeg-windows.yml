name: Build speech_utils Windows FFmpeg SDK

on:
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: "FFmpeg git ref (tag/branch/commit)"
        required: true
        default: "n7.1.1"
      artifact_name:
        description: "Artifact name"
        required: true
        default: "speech-utils-ffmpeg-windows-x64"
      retention_days:
        description: "Artifact retention days"
        required: true
        default: "30"

permissions:
  contents: read

jobs:
  build-windows-ffmpeg-sdk:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_DIR: packages/speech_utils
      FFMPEG_SOURCE_DIR: packages/speech_utils/third_party/ffmpeg/source/ffmpeg
      FFMPEG_OUTPUT_DIR: packages/speech_utils/third_party/ffmpeg/windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MSYS2 build utilities
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make
            diffutils
            pkgconf
            nasm
            perl

      - name: Checkout FFmpeg source
        run: |
          $ffmpegRef = "${{ inputs.ffmpeg_ref }}"

          Remove-Item -Recurse -Force "$env:FFMPEG_SOURCE_DIR" -ErrorAction SilentlyContinue
          $sourceParent = Split-Path -Parent "$env:FFMPEG_SOURCE_DIR"
          New-Item -ItemType Directory -Force -Path $sourceParent | Out-Null

          git clone --filter=blob:none --no-checkout https://github.com/FFmpeg/FFmpeg.git "$env:FFMPEG_SOURCE_DIR"
          git -C "$env:FFMPEG_SOURCE_DIR" fetch --depth 1 origin $ffmpegRef
          git -C "$env:FFMPEG_SOURCE_DIR" checkout --detach FETCH_HEAD

          $ffmpegCommit = git -C "$env:FFMPEG_SOURCE_DIR" rev-parse HEAD
          "FFMPEG_REF=$ffmpegRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_COMMIT=$ffmpegCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Checked out FFmpeg ref '$ffmpegRef' at commit $ffmpegCommit"

      - name: Build minimal FFmpeg SDK for speech_utils
        run: |
          ./packages/speech_utils/tool/build_windows_ffmpeg_sdk.ps1 `
            -SourceDir "$env:FFMPEG_SOURCE_DIR" `
            -OutputDir "$env:FFMPEG_OUTPUT_DIR"

      - name: Package SDK artifact
        run: |
          $artifactName = "${{ inputs.artifact_name }}"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "speech_utils_ffmpeg_windows_sdk"
          $artifactZip = Join-Path $env:RUNNER_TEMP "$artifactName.zip"

          Remove-Item -Recurse -Force $artifactRoot -ErrorAction SilentlyContinue
          Remove-Item -Force $artifactZip -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          Copy-Item "$env:FFMPEG_OUTPUT_DIR/include" -Destination $artifactRoot -Recurse
          Copy-Item "$env:FFMPEG_OUTPUT_DIR/lib" -Destination $artifactRoot -Recurse
          Copy-Item "$env:FFMPEG_OUTPUT_DIR/bin" -Destination $artifactRoot -Recurse
          Copy-Item "$env:PACKAGE_DIR/third_party/ffmpeg/windows/README.md" -Destination $artifactRoot
          Copy-Item "$env:PACKAGE_DIR/third_party/ffmpeg/windows/SOURCE.txt" -Destination $artifactRoot

          $metadata = @{
            package = "speech_utils"
            target = "windows-x64"
            ffmpeg_ref = "$env:FFMPEG_REF"
            ffmpeg_commit = "$env:FFMPEG_COMMIT"
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            workflow = "$env:GITHUB_WORKFLOW"
            run_id = "$env:GITHUB_RUN_ID"
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Depth 5

          $metadata | Out-File -FilePath (Join-Path $artifactRoot "BUILD-METADATA.json") -Encoding utf8

          Compress-Archive -Path (Join-Path $artifactRoot "*") -DestinationPath $artifactZip
          "ARTIFACT_ZIP=$artifactZip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.ARTIFACT_ZIP }}
          retention-days: ${{ fromJSON(inputs.retention_days) }}
