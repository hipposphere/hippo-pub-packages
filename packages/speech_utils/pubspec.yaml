name: speech_utils
description: Utilities for PCM16 speech segmentation, segmented capture, and AAC compression.
version: 0.2.19
homepage: https://hippolabs.org
publish_to: "https://registry.hippolabs.org/pub/internal-pub/"
resolution: workspace

environment:
  sdk: ">=3.12.0 < 4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.2.1
  cross_file: ^0.3.5+4
  dart_sentencepiece_tokenizer: ^1.3.2
  ffi: ^2.2.0
  hippo_native_deps:
    hosted: https://registry.hippolabs.org/pub/internal-pub/
    version: ^0.1.1
  hooks: ^2.0.2
  jni: ^1.0.0
  jni_flutter: ^1.0.1
  native_toolchain_c: ^0.19.2
  path: ^1.9.1

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  jnigen: ^0.16.0
  lints: ^6.1.0
  test: ^1.31.1

flutter:
  assets:
    - assets/wake_word/sherpa_kws_en/
  plugin:
    platforms:
      android:
        package: org.hippolabs.speech_utils
        pluginClass: SpeechUtilsPlugin
